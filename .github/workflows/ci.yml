name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every external action is pinned to an immutable full commit SHA.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install project
        run: |
          # Install only the CPU wheel from PyTorch; resolve all dependencies from PyPI below.
          python -m pip install --disable-pip-version-check --no-deps -c backend/constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -c backend/constraints.txt -e "backend[dev,learning]"

      - name: Lint
        run: ruff check backend/app backend/tests backend/serve.py

      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/app

      - name: Test
        run: cd backend && pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Set up Python for browser scenario
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare isolated browser scenario
        run: |
          python -m pip install -c ../backend/constraints.txt -e "../backend[dev]"
          python ../backend/tests/export_ui_scenario.py
          npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test
