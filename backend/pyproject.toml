[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matchlab-local"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "uvicorn[standard]>=0.34,<1", "duckdb>=1.2,<2",
  "numpy>=2.1,<3", "scipy>=1.15,<2", "polars>=1.22,<2", "PyYAML>=6,<7",
  "tzdata>=2025.1", "pytz>=2025.1", "rapidfuzz>=3.12,<4",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-PyYAML", "pip-audit>=2.10,<3"]
learning = ["scikit-learn>=1.6,<2", "xgboost>=3,<4", "lightgbm>=4.6,<5", "catboost>=1.2,<2", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
