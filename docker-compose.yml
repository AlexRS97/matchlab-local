name: football-analytics

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: 0.50
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    cpus: 0.25
    mem_limit: 128m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.50
    mem_limit: 384m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: uvicorn football_api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    cpus: 0.75
    mem_limit: 512m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: celery -A football_api.worker.celery_app worker --loglevel=INFO --concurrency=2
    cpus: 1.00
    mem_limit: 640m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: celery -A football_api.worker.celery_app beat --loglevel=INFO
    cpus: 0.25
    mem_limit: 192m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    cpus: 0.50
    mem_limit: 384m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  dbt:
    build:
      context: .
      dockerfile: infrastructure/docker/dbt.Dockerfile
    environment:
      DBT_HOST: postgres
      DBT_PORT: 5432
      DBT_USER: ${POSTGRES_USER:-football}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-football_local_password}
      DBT_DATABASE: ${POSTGRES_DB:-football_analytics}
      DBT_SCHEMA: analytics
    volumes:
      - ./dbt:/usr/app/dbt
    cpus: 1.00
    mem_limit: 768m
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["analytics"]

volumes:
  postgres_data:
  redis_data:
