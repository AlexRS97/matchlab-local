[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics-platform"
version = "0.1.0"
description = "Plataforma local y escalable de analisis estadistico de futbol"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "celery[redis]==5.4.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
]

[tool.setuptools.packages.find]
where = ["apps/api", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "packages"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "packages", "tests"]
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
