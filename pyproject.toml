[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics-platform"
version = "0.1.0"
description = "Plataforma local y escalable de analisis estadistico de futbol"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "celery[redis]==5.6.3",
  "fastapi==0.140.13",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["apps/api", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "packages"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "packages", "tests"]
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
